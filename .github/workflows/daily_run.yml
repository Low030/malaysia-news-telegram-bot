name: Malaysia News Push

on:
  schedule:
    # 每天多次运行，实现准即时效果（UTC）
    # 北京时间约：08:00 / 12:00 / 16:00 / 20:00 / 00:00
    - cron: "0 0,4,8,12,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MESSAGE_FOOTER: ${{ secrets.MESSAGE_FOOTER }}
          MAX_PUSH_PER_RUN: "3"
        run: python main.py

      - name: Commit and push history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news_pushed_history.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update news_pushed_history.json [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
